name: Update CloudFlare Preferred IP List

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-ip-list:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.email "tianshideyou@proton.me"
          git config --global user.name "tianshipapa"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache: false

      - name: Initialize Go module and download dependencies
        run: |
          rm -f go.sum          # 删除旧的 go.sum
          go mod tidy           # 重新生成 go.sum
          go mod download

      - name: Run IP collector
        run: go run collect_ips.go

      - name: Commit and push changes
        run: |
          rm -f .git/index.lock 2>/dev/null
          rm -f .git/refs/heads/main.lock 2>/dev/null

          if [ -n "$(git status --porcelain -- ip.txt go.sum)" ]; then
            git add ip.txt go.sum
            git commit -m "🔄 Auto update: $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "✅ 更新推送成功"
          else
            echo "🔄 未检测到IP变化，跳过提交"
          fi
