name: Update CloudFlare Preferred IP List

on:
  schedule:
    # 每天 UTC 16:00（北京时间 00:00）运行
    - cron: '0 16 * * *'
  workflow_dispatch:  # 支持手动触发
  push:
    branches:
      - main

jobs:
  update-ip-list:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 仓库写入权限

    steps:
      # ========== 步骤1：检出代码 ==========
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ========== 步骤2：同步远程最新代码 ==========
      - name: Pre-sync repository
        run: |
          git config --global user.email "tianshideyou@proton.me"
          git config --global user.name "tianshipapa"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/camel52zhang/yxip.git
          git pull origin main --rebase

      # ========== 步骤3：安装 Go 环境 ==========
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      # ========== 步骤4：下载依赖 ==========
      - name: Install dependencies
        run: |
          go mod tidy
          go mod download

      # ========== 步骤5：运行采集脚本 ==========
      - name: Run IP collector
        run: go run collect_ips.go

      # ========== 步骤6：提交并推送变更 ==========
      - name: Commit and push changes
        run: |
          if [ -n "$(git status --porcelain -- ip.txt)" ]; then
            git add ip.txt
            git commit -m "🔄 Auto update: $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"

            # 带重试的推送机制（最多3次）
            for i in 1 2 3; do
              git pull --rebase origin main && break || sleep 5
            done

            git push origin HEAD:main
            echo "✅ 更新推送成功"
          else
            echo "🔄 未检测到IP变化，跳过提交"
          fi
